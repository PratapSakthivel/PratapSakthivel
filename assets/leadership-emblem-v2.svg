<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="110" viewBox="0 0 880 110" fill="none">
  <defs>
    <pattern id="leaderHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFD75E" opacity="0.2"/>
      <circle cx="7" cy="6" r="0.6" fill="#D62828" opacity="0.2"/>
    </pattern>
    <radialGradient id="leaderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD75E" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#D62828" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaderShieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD75E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF2D95" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D62828" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="leaderWebGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="880" height="110" fill="url(#leaderHalftone)"/>
  <rect width="880" height="110" fill="url(#leaderGlow)"/>
  <!-- Center pulsing shield -->
  <g transform="translate(440,55)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" repeatCount="indefinite"/>
      <!-- RGB-split glitch behind shield -->
      <path d="M0,-32 L26,-22 L26,8 C26,22 14,32 0,38 C-14,32 -26,22 -26,8 L-26,-22 Z" fill="#FF2D95" opacity="0.4" transform="translate(-2,0)"/>
      <path d="M0,-32 L26,-22 L26,8 C26,22 14,32 0,38 C-14,32 -26,22 -26,8 L-26,-22 Z" fill="#00C2FF" opacity="0.4" transform="translate(2,0)"/>
      <!-- Main shield outline -->
      <path d="M0,-32 L26,-22 L26,8 C26,22 14,32 0,38 C-14,32 -26,22 -26,8 L-26,-22 Z" fill="url(#leaderShieldGrad)" stroke="#1A1A1A" stroke-width="2"/>
      <!-- Spider-web interior pattern -->
      <g stroke="url(#leaderWebGrad)" stroke-width="0.9" fill="none" opacity="0.8">
        <line x1="0" y1="-28" x2="0" y2="34"/>
        <line x1="-22" y1="-12" x2="22" y2="-12"/>
        <line x1="-22" y1="4" x2="22" y2="4"/>
        <line x1="-18" y1="20" x2="18" y2="20"/>
        <path d="M0,-16 L-14,-12 L-18,4 L0,12 L18,4 L14,-12 Z" stroke-dasharray="2 3"/>
        <path d="M0,-2 L-10,4 L0,12 L10,4 Z" stroke-dasharray="2 3"/>
      </g>
      <!-- Central spider emblem -->
      <g transform="translate(0,-2)">
        <circle cx="0" cy="-3" r="3" fill="#1A1A1A"/>
        <circle cx="0" cy="2" r="3.5" fill="#1A1A1A"/>
        <g stroke="#1A1A1A" stroke-width="1" fill="none">
          <path d="M-3,-2 Q-8,-5 -12,-9"/>
          <path d="M-4,0 Q-10,-1 -14,-3"/>
          <path d="M-4,2 Q-10,4 -13,8"/>
          <path d="M3,-2 Q8,-5 12,-9"/>
          <path d="M4,0 Q10,-1 14,-3"/>
          <path d="M4,2 Q10,4 13,8"/>
        </g>
      </g>
    </g>
  </g>
  <!-- Flanking small spider decorations -->
  <g transform="translate(280,55)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="2.5s" repeatCount="indefinite"/>
      <circle r="4" fill="#1A1A1A"/>
      <g stroke="#1A1A1A" stroke-width="0.8" fill="none">
        <path d="M-3,0 Q-7,-3 -10,-5"/>
        <path d="M-3,1 Q-8,1 -11,2"/>
        <path d="M-3,2 Q-7,4 -10,7"/>
        <path d="M3,0 Q7,-3 10,-5"/>
        <path d="M3,1 Q8,1 11,2"/>
        <path d="M3,2 Q7,4 10,7"/>
      </g>
    </g>
  </g>
  <g transform="translate(600,55)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="10;-10;10" dur="2.5s" repeatCount="indefinite"/>
      <circle r="4" fill="#1A1A1A"/>
      <g stroke="#1A1A1A" stroke-width="0.8" fill="none">
        <path d="M-3,0 Q-7,-3 -10,-5"/>
        <path d="M-3,1 Q-8,1 -11,2"/>
        <path d="M-3,2 Q-7,4 -10,7"/>
        <path d="M3,0 Q7,-3 10,-5"/>
        <path d="M3,1 Q8,1 11,2"/>
        <path d="M3,2 Q7,4 10,7"/>
      </g>
    </g>
  </g>
  <!-- Side halftone scatter -->
  <g fill="#FFD75E" opacity="0.4">
    <circle cx="150" cy="40" r="2"/>
    <circle cx="180" cy="70" r="1.5"/>
    <circle cx="120" cy="80" r="1.8"/>
    <circle cx="730" cy="40" r="2"/>
    <circle cx="700" cy="70" r="1.5"/>
    <circle cx="760" cy="80" r="1.8"/>
  </g>
</svg>
