<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" fill="none">
  <defs>
    <pattern id="footerHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFD75E" opacity="0.18"/>
      <circle cx="7" cy="6" r="0.6" fill="#D62828" opacity="0.18"/>
    </pattern>
    <radialGradient id="footerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D95" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3E7BD6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="80" fill="url(#footerHalftone)"/>
  <rect width="880" height="80" fill="url(#footerGlow)"/>
  <!-- Wavy line of pulsing colored dots -->
  <g>
    <circle cx="100" cy="40" r="3" fill="#D62828">
      <animate attributeName="r" values="2;5;2" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="30" r="3" fill="#FF2D95">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="50" r="3" fill="#FFD75E">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="35" r="3" fill="#FFD75E">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="35" r="3" fill="#FFD75E">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="50" r="3" fill="#00C2FF">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="30" r="3" fill="#3E7BD6">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="40" r="3" fill="#D62828">
      <animate attributeName="r" values="2;5;2" dur="1.8s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Connecting web strands (subtle) -->
  <g stroke="#FFD75E" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="40" x2="200" y2="30"/>
    <line x1="200" y1="30" x2="300" y2="50"/>
    <line x1="300" y1="50" x2="400" y2="35"/>
    <line x1="400" y1="35" x2="480" y2="35"/>
    <line x1="480" y1="35" x2="580" y2="50"/>
    <line x1="580" y1="50" x2="680" y2="30"/>
    <line x1="680" y1="30" x2="780" y2="40"/>
  </g>
  <!-- Multiple crawling spiders across the wave -->
  <g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" path="M0,40 Q220,20 440,40 Q660,60 880,40"/>
      <circle r="2.5" fill="#1A1A1A"/>
      <line x1="-2" y1="0" x2="-5" y2="-3" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="-6" y2="0" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="-5" y2="3" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="5" y2="-3" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="6" y2="0" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="5" y2="3" stroke="#1A1A1A" stroke-width="0.5"/>
    </g>
  </g>
  <g>
    <g>
      <animateMotion dur="16s" begin="5s" repeatCount="indefinite" path="M880,40 Q660,60 440,40 Q220,20 0,40"/>
      <circle r="2" fill="#D62828"/>
      <line x1="-1.5" y1="0" x2="-4" y2="-2.5" stroke="#D62828" stroke-width="0.4"/>
      <line x1="-1.5" y1="0" x2="-5" y2="0" stroke="#D62828" stroke-width="0.4"/>
      <line x1="-1.5" y1="0" x2="-4" y2="2.5" stroke="#D62828" stroke-width="0.4"/>
      <line x1="1.5" y1="0" x2="4" y2="-2.5" stroke="#D62828" stroke-width="0.4"/>
      <line x1="1.5" y1="0" x2="5" y2="0" stroke="#D62828" stroke-width="0.4"/>
      <line x1="1.5" y1="0" x2="4" y2="2.5" stroke="#D62828" stroke-width="0.4"/>
    </g>
  </g>
  <!-- Top edge spark stars -->
  <g fill="#FFD75E">
    <g transform="translate(440,8)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"/>
    </g>
    <g transform="translate(60,12)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
    <g transform="translate(820,12)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="1s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
  </g>
</svg>
