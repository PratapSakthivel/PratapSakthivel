<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" fill="none">
  <defs>
    <pattern id="powHalftone" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFD75E" opacity="0.4"/>
      <circle cx="6" cy="6" r="0.7" fill="#FF2D95" opacity="0.4"/>
    </pattern>
    <radialGradient id="powGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D95" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#D62828" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="120" fill="url(#powHalftone)"/>
  <rect width="880" height="120" fill="url(#powGlow)"/>
  <!-- Side sparkle stars -->
  <g fill="#FFD75E">
    <g transform="translate(120,30)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"/>
    </g>
    <g transform="translate(760,90)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"/>
    </g>
    <g transform="translate(150,95)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
    <g transform="translate(730,25)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.4s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
  </g>
  <!-- Pulsing center glow -->
  <g transform="translate(440,60)">
    <circle r="40" fill="#FFD75E" opacity="0.3">
      <animate attributeName="r" values="30;50;30" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Halftone ring -->
    <circle r="35" fill="none" stroke="#D62828" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  </g>
  <!-- Multiple crawling spiders in random paths -->
  <g>
    <g>
      <animateMotion dur="18s" repeatCount="indefinite" path="M0,30 Q220,80 440,40 Q660,90 880,30"/>
      <circle r="3" fill="#1A1A1A"/>
      <line x1="-2.5" y1="0" x2="-6" y2="-3.5" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="-2.5" y1="0" x2="-7" y2="0" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="-2.5" y1="0" x2="-6" y2="3.5" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2.5" y1="0" x2="6" y2="-3.5" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2.5" y1="0" x2="7" y2="0" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="2.5" y1="0" x2="6" y2="3.5" stroke="#1A1A1A" stroke-width="0.5"/>
    </g>
  </g>
  <g>
    <g>
      <animateMotion dur="22s" begin="4s" repeatCount="indefinite" path="M880,80 Q660,30 440,70 Q220,20 0,80"/>
      <circle r="2.5" fill="#D62828"/>
      <line x1="-2" y1="0" x2="-5" y2="-3" stroke="#D62828" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="-6" y2="0" stroke="#D62828" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="-5" y2="3" stroke="#D62828" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="5" y2="-3" stroke="#D62828" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="6" y2="0" stroke="#D62828" stroke-width="0.5"/>
      <line x1="2" y1="0" x2="5" y2="3" stroke="#D62828" stroke-width="0.5"/>
    </g>
  </g>
  <!-- Glitch accent lines -->
  <g stroke-width="0.8">
    <line x1="100" y1="20" x2="220" y2="20" stroke="#00C2FF" opacity="0.5">
      <animate attributeName="x2" values="220;200;220;240;220" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="660" y1="100" x2="780" y2="100" stroke="#FF2D95" opacity="0.5">
      <animate attributeName="x1" values="660;680;660;640;660" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
