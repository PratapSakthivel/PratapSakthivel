<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" fill="none">
  <defs>
    <pattern id="senseHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#3E7BD6" opacity="0.2"/>
      <circle cx="7" cy="6" r="0.6" fill="#FF2D95" opacity="0.2"/>
    </pattern>
    <radialGradient id="senseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF2D95" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Halftone background -->
  <rect width="880" height="120" fill="url(#senseHalftone)"/>
  <!-- Center color glow -->
  <rect width="880" height="120" fill="url(#senseGlow)"/>
  <!-- 4 concentric pulsing rings -->
  <g transform="translate(440,60)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#3E7BD6" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="8;52;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="8;52;8" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FFD75E" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="8;52;8" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FF2D95" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="8;52;8" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <!-- Halftone ring decoration -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#3E7BD6" stroke-width="1" stroke-dasharray="2 4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FF2D95" stroke-width="1" stroke-dasharray="3 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
    </circle>
    <!-- RGB-split glitch center spider -->
    <circle cx="-2" cy="0" r="7" fill="#FF2D95" opacity="0.5">
      <animate attributeName="cx" values="-2;-4;-2;0;-2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="2" cy="0" r="7" fill="#00C2FF" opacity="0.5">
      <animate attributeName="cx" values="2;4;2;0;2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#FFD75E">
      <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Spider body -->
    <circle cx="0" cy="-2" r="2.5" fill="#1A1A1A"/>
    <circle cx="0" cy="2" r="3" fill="#1A1A1A"/>
    <g stroke="#1A1A1A" stroke-width="0.9" fill="none">
      <path d="M-3,-1 Q-8,-3 -12,-7"/>
      <path d="M-4,0 Q-10,0 -14,-1"/>
      <path d="M-4,1 Q-10,3 -13,7"/>
      <path d="M3,-1 Q8,-3 12,-7"/>
      <path d="M4,0 Q10,0 14,-1"/>
      <path d="M4,1 Q10,3 13,7"/>
    </g>
  </g>
  <!-- Side sparkle stars -->
  <g fill="#FFD75E">
    <g transform="translate(120,30)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"/>
    </g>
    <g transform="translate(760,90)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"/>
    </g>
    <g transform="translate(150,95)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
    <g transform="translate(730,25)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
    </g>
  </g>
</svg>
