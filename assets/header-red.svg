<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="90" viewBox="0 0 880 90" fill="none">
  <defs>
    <pattern id="v2redDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#D62828" opacity="0.35"/>
      <circle cx="8" cy="7" r="0.8" fill="#FF2D95" opacity="0.25"/>
    </pattern>
    <radialGradient id="v2redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D62828" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF2D95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v2redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D62828" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="80%" stop-color="#D62828" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Halftone dot pattern background -->
  <rect width="880" height="90" fill="url(#v2redDots)"/>
  <!-- Center color glow -->
  <rect width="880" height="90" fill="url(#v2redGlow)"/>
  <!-- Top-left spider-web corner -->
  <g transform="translate(0,0)" stroke="#D62828" stroke-width="0.8" opacity="0.7" fill="none">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="60"/>
    <line x1="0" y1="0" x2="42" y2="42"/>
    <path d="M0,20 Q20,0 40,0" stroke-dasharray="3 4"/>
    <path d="M0,40 Q40,0 60,0" stroke-dasharray="3 4"/>
    <path d="M20,0 Q0,20 0,40" stroke-dasharray="3 4"/>
    <path d="M40,0 Q0,40 0,60" stroke-dasharray="3 4"/>
  </g>
  <!-- Top-right spider-web corner -->
  <g transform="translate(880,0) scale(-1,1)" stroke="#D62828" stroke-width="0.8" opacity="0.7" fill="none">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="60"/>
    <line x1="0" y1="0" x2="42" y2="42"/>
    <path d="M0,20 Q20,0 40,0" stroke-dasharray="3 4"/>
    <path d="M0,40 Q40,0 60,0" stroke-dasharray="3 4"/>
    <path d="M20,0 Q0,20 0,40" stroke-dasharray="3 4"/>
    <path d="M40,0 Q0,40 0,60" stroke-dasharray="3 4"/>
  </g>
  <!-- Center pulsing spider emblem -->
  <g transform="translate(440,45)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2.5s" repeatCount="indefinite"/>
      <circle cx="-1" cy="0" r="9" fill="#FF2D95" opacity="0.4"/>
      <circle cx="1" cy="0" r="9" fill="#00C2FF" opacity="0.4"/>
      <circle cx="0" cy="0" r="7" fill="#FFD75E" opacity="0.7"/>
      <!-- Spider body -->
      <circle cx="0" cy="-2" r="3" fill="#1A1A1A"/>
      <circle cx="0" cy="2" r="3.5" fill="#1A1A1A"/>
      <!-- Spider legs -->
      <g stroke="#1A1A1A" stroke-width="1" fill="none">
        <path d="M-3,-1 Q-8,-3 -12,-7"/>
        <path d="M-4,0 Q-10,0 -14,-1"/>
        <path d="M-4,1 Q-10,3 -13,7"/>
        <path d="M3,-1 Q8,-3 12,-7"/>
        <path d="M4,0 Q10,0 14,-1"/>
        <path d="M4,1 Q10,3 13,7"/>
      </g>
    </g>
  </g>
  <!-- Glitch side accents -->
  <g stroke="#00C2FF" stroke-width="0.8" opacity="0.6">
    <line x1="100" y1="20" x2="200" y2="20">
      <animate attributeName="x1" values="100;120;100" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="680" y1="70" x2="780" y2="70">
      <animate attributeName="x2" values="780;760;780" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- Bottom gradient line -->
  <rect x="0" y="86" width="880" height="4" fill="url(#v2redLine)"/>
</svg>
