<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" fill="none">
  <defs>
    <pattern id="trainingHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#D62828" opacity="0.25"/>
      <circle cx="7" cy="6" r="0.6" fill="#00C2FF" opacity="0.2"/>
    </pattern>
    <radialGradient id="trainingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD75E" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#D62828" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trainingLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D62828" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFD75E" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="880" height="100" fill="url(#trainingHalftone)"/>
  <rect width="880" height="100" fill="url(#trainingGlow)"/>
  <!-- Center concentric target rings (LeetCode-style target/practice visual) -->
  <g transform="translate(440,50)">
    <!-- Outer ring (rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <circle r="38" fill="none" stroke="#D62828" stroke-width="1" stroke-dasharray="3 6" opacity="0.7"/>
      <line x1="-42" y1="0" x2="-36" y2="0" stroke="#D62828" stroke-width="1.5"/>
      <line x1="36" y1="0" x2="42" y2="0" stroke="#D62828" stroke-width="1.5"/>
      <line x1="0" y1="-42" x2="0" y2="-36" stroke="#D62828" stroke-width="1.5"/>
      <line x1="0" y1="36" x2="0" y2="42" stroke="#D62828" stroke-width="1.5"/>
    </g>
    <!-- Middle ring (counter-rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="#FFD75E" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.8"/>
    </g>
    <!-- Inner pulsing bullseye -->
    <circle r="14" fill="#D62828" opacity="0.8">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#FFD75E">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Center spider -->
    <circle cx="0" cy="-1" r="2" fill="#1A1A1A"/>
    <circle cx="0" cy="2" r="2.5" fill="#1A1A1A"/>
    <g stroke="#1A1A1A" stroke-width="0.7" fill="none">
      <path d="M-2,-1 Q-5,-3 -7,-5"/>
      <path d="M-2,0 Q-6,0 -8,-1"/>
      <path d="M-2,1 Q-5,3 -7,5"/>
      <path d="M2,-1 Q5,-3 7,-5"/>
      <path d="M2,0 Q6,0 8,-1"/>
      <path d="M2,1 Q5,3 7,5"/>
    </g>
  </g>
  <!-- Halftone scatter -->
  <g fill="#D62828" opacity="0.4">
    <circle cx="120" cy="35" r="2"/>
    <circle cx="160" cy="65" r="1.5"/>
    <circle cx="200" cy="25" r="1.8"/>
    <circle cx="760" cy="35" r="2"/>
    <circle cx="720" cy="65" r="1.5"/>
    <circle cx="680" cy="25" r="1.8"/>
  </g>
  <g fill="#00C2FF" opacity="0.35">
    <circle cx="100" cy="75" r="1.6"/>
    <circle cx="180" cy="50" r="1.2"/>
    <circle cx="780" cy="75" r="1.6"/>
    <circle cx="700" cy="50" r="1.2"/>
  </g>
  <!-- Top edge line -->
  <rect x="0" y="0" width="880" height="3" fill="url(#trainingLine)"/>
  <rect x="0" y="97" width="880" height="3" fill="url(#trainingLine)"/>
</svg>
